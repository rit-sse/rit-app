<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — RIT App Docs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.65; color: #1a1a1a; }
    h1, h2, h3 { line-height: 1.25; }
    h2 { border-bottom: 1px solid #e5e5e5; padding-bottom: 0.3rem; }
    a { color: #c75b12; }
    code { background: #f4f4f4; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.88em; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; font-size: 0.9em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.45rem 0.9rem; text-align: left; }
    th { background: #f4f4f4; font-weight: 600; }
    hr { border: none; border-top: 1px solid #e5e5e5; margin: 2rem 0; }
    nav { margin-bottom: 1.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav><a href="/docs/">← All Docs</a></nav>
  <main>{{body}}</main>
</body>
</html>
